name: qa

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Testes de unidade
        run: npm test

      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: npx playwright test

      - name: Relatório e rastros
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: qa/.artifacts
          retention-days: 7
